name: Sync upstream and personal branch

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-and-personal
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rowan-fan/rime-ice'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/iDvel/rime-ice.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Merge main into personal branch
        run: |
          git fetch origin personal/translation-annotation
          git switch -c personal/translation-annotation --track origin/personal/translation-annotation
          git merge --no-edit main

      - name: Check for branch updates
        id: changes
        run: |
          if [[ "$(git rev-parse main)" != "$(git rev-parse origin/main)" || \
                "$(git rev-parse HEAD)" != "$(git rev-parse origin/personal/translation-annotation)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lint dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks yamllint
          sudo luarocks --lua-version=5.4 install luacheck

      - name: Set up Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: others/script/go.mod
          cache-dependency-path: others/script/go.sum

      - name: Check merged configuration
        if: steps.changes.outputs.changed == 'true'
        env:
          LUAC: luac5.4
        run: |
          make -C others/script build
          make -C others/script lint
          lua5.4 others/script/tests/translation_annotation.lua "$PWD"
          git diff --exit-code
          git diff --check origin/personal/translation-annotation..HEAD

      - name: Push checked branches
        if: steps.changes.outputs.changed == 'true'
        run: git push origin main:main HEAD:personal/translation-annotation
